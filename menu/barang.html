<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Barang Terkirim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header & Kembali ke Home -->
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Barang Terkirim</h1>
                <p class="text-gray-500">Sinkronisasi Real-time dengan Firebase Firestore.</p>
            </div>
            <a href="../index.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition text-sm">
                ← Kembali ke Menu
            </a>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-700">Daftar Pengiriman Barang</h2>
            <button type="button" onclick="openBarangModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition cursor-pointer">
                + Tambah Barang Terkirim
            </button>
        </div>

        <!-- Tabel Barang Terkirim -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bbg-gray-50 text-gray-600 text-[10px] sm:text-sm uppercase tracking-wider">
                            <th class="py-3 px-6">No. Surat Jalan</th>
                            <th class="py-3 px-6">Tanggal Kirim</th>
                            <th class="py-3 px-6">Nama Barang</th>
                            <th class="py-3 px-6 text-center">Jumlah</th>
                            <th class="py-3 px-6">Konsumen</th>
                            <th class="py-3 px-6 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBarangBody" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <tr><td colspan="6" class="text-center py-6 text-gray-400">Memuat data barang terkirim...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form Tambah Barang Terkirim -->
<div id="barangModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Tambah Barang Terkirim</h3>
        <form id="barangForm">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">No. Surat Jalan</label>
                    <input type="text" id="inputNoSJ" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Cth: SJ-001">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Kirim</label>
                    <input type="date" id="inputTglKirim" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Konsumen</label>
                <input type="text" id="inputKonsumenBarang" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Nama Konsumen">
            </div>

            <!-- Bagian Daftar Item Barang Dinamis -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Daftar Barang</label>
                    <button type="button" onclick="addItemRow()" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-lg transition">
                        + Tambah Baris Barang
                    </button>
                </div>
                <div id="itemRowsContainer" class="space-y-2">
                    <!-- Baris item akan dimasukkan lewat JS secara dinamis -->
                </div>
            </div>

            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="closeBarangModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition">Batal</button>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition">Simpan</button>
            </div>
        </form>
    </div>
</div>

    <script type="module" src="../script.js"></script>
</body>
</html>
